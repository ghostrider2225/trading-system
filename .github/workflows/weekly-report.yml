name: Weekly Trading Report

on:
  schedule:
    # Every Saturday at 10:00 UTC (10 AM UK time)
    - cron: '0 10 * * 6'
  workflow_dispatch:  # can also manually trigger

jobs:
  weekly-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -q pyyaml yfinance pandas

      - name: Pull latest database
        run: git pull origin main --no-rebase

      - name: Send weekly report
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: python3 email_weekly_report.py

      - name: Commit any changes
        run: |
          git config user.name "Trading System Bot"
          git config user.email "noreply@github.com"
          git add -A
          git diff --cached --quiet || git commit -m "data: weekly report sent"
          git push origin main

      - name: Notify if failed
        if: failure()
        run: echo "Weekly report failed — check logs above"
